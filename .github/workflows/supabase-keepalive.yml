# Supabase pauses free-tier projects after ~1 week without activity, which
# breaks login and sync. This pings the database once a day to keep it awake.
#
# Setup (once): GitHub repo → Settings → Secrets and variables → Actions →
#   New repository secret:
#     SUPABASE_URL       e.g. https://abcd1234.supabase.co
#     SUPABASE_ANON_KEY  the public "anon" key (same as NEXT_PUBLIC_SUPABASE_ANON_KEY)
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 * * *" # every day, 10:17 WIB
  workflow_dispatch: # allow a manual "Run workflow" test

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secret SUPABASE_URL / SUPABASE_ANON_KEY belum diisi."
            exit 1
          fi
          # A real query through PostgREST counts as database activity. RLS
          # returns an empty list for the anon role — that's fine.
          curl -fsS --retry 3 --retry-delay 10 \
            "${SUPABASE_URL%/}/rest/v1/workspaces?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo
          echo "Supabase is awake ✅"
