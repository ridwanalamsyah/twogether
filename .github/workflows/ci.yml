# Checks every pull request and push to main before Vercel ships it:
# types, lint and the unit tests (dates in WIB, sync merge, money maths),
# end-to-end tests on the built app, and the database migrations + security
# scenarios on a real Postgres.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          TZ: Asia/Jakarta

  e2e:
    # Builds the real static export and clicks through it in Chromium:
    # main screens open without errors or overflow, pull-to-refresh behaves.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          TZ: Asia/Jakarta
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  database:
    # Every migration on a real Postgres (twice: must be re-runnable), then
    # the security scenarios: strangers can't join or read a couple's
    # space, invites, leaving, stale offline edits, notification triggers.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-db.sh
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
